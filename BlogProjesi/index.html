<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClubGALA | Özel Oyuncu Koleksiyonları</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container nav-container">
            <a href="#" class="logo" id="homeLogo">Club<span>GALA</span></a>
            <nav class="nav-links">
                <a href="#" id="homeLink">Ana Sayfa</a>
                <a href="#">Koleksiyonlar</a>
                <a href="#">İletişim</a>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        
        <section class="controls-section" id="heroSection">
            <h1 class="page-title">Yıldız Oyuncu Koleksiyonları</h1>
            <p class="page-subtitle">Ürünlerini ve koleksiyonunu incelemek istediğiniz yıldızı seçin</p>
        </section>

        <section class="players-selection-grid" id="playersSelectionGrid">
        </section>

        <section class="detail-section" id="detailSection" style="display: none;">
            <div class="detail-header">
                <button class="back-btn" id="backToHomeBtn">&larr; Tüm Oyunculara Dön</button>
                <div class="selected-player-banner" id="selectedPlayerBanner"></div>
            </div>
            <div class="posts-grid" id="productsContainer"></div>
        </section>

    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 ClubGALA. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
